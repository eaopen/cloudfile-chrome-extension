name: CloudFile Chrome Extension tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test extension Native Messaging routing
        run: node --test tests/*.cjs
      - name: Validate manifest JSON
        run: node -e "const m = require('./manifest.json'); if(m.manifest_version !== 3) process.exit(1)"
