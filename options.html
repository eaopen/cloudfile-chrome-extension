<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CloudFile Local Console 设置</title><link rel="stylesheet" href="options.css"></head>
<body><main><p class="eyebrow">CLOUDFILE / LOCAL PAIRING</p><h1>连接本地 Agent</h1><p class="lead">扩展只与本机回环地址通信。配对令牌保存在 Chrome 的本地扩展存储中。</p><form id="settings"><label>Agent 地址<input name="endpoint" type="url" placeholder="http://127.0.0.1:4317" required></label><label>配对令牌<input name="token" type="password" minlength="16" autocomplete="off" required></label><button>保存连接</button><p id="status" role="status"></p></form><aside><strong>安全边界</strong><br>Agent 默认只接受 127.0.0.1，并限制项目目录位于 <code>CLOUDFILE_AGENT_ROOT</code> 之内。</aside></main><script type="module" src="options.js"></script></body></html>
