<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudFile Local</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">CLOUDFILE / LOCAL</p>
    <h1>本地会话接收器</h1>
    <p class="intro">在 CloudFile 网页选择本地打开或编辑，即可使用本机应用处理文件。</p>
    <div id="status" class="status" aria-live="polite">正在检查 Agent…</div>
    <div class="primary-actions">
      <button id="open-task-center" type="button" hidden>打开任务中心</button>
    </div>
    <p id="open-task-center-hint" class="workspace-hint" hidden></p>
    <p id="applications" class="applications" hidden></p>
    <section id="workspace" class="workspace" hidden>
      <p class="workspace-label">本地文件目录</p>
      <code id="workspace-path" class="workspace-path"></code>
      <div class="workspace-actions">
        <button id="open-workspace" type="button" hidden>打开本地目录</button>
        <button id="copy-workspace" type="button" hidden>复制本地路径</button>
      </div>
      <p id="workspace-hint" class="workspace-hint" hidden></p>
    </section>
    <section id="task-center" class="workspace" hidden>
      <p class="workspace-label">本地编辑任务（只读）</p>
      <div id="task-summary" aria-live="polite"></div>
    </section>
    <section id="update" class="update" hidden>
      <p class="update-label">有新版本可用</p>
      <p id="update-text" class="update-text"></p>
      <div id="update-actions" class="update-actions" hidden>
        <button id="update-extension-apply" type="button" hidden>立即升级扩展</button>
      </div>
      <p id="update-hint" class="update-hint" hidden></p>
      <p id="update-status" class="update-status" hidden></p>
    </section>
    <button id="help" type="button" class="help-link">安装帮助</button>
    <p id="help-hint" class="help-hint" hidden></p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
